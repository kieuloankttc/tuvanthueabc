--green-800:#005040;
--green-700:#106040; /* primary */
--green-600:#107040;
--green-500:#14804A;

--lime-600:#408020;
--lime-500:#5CA828; /* arrow / growth accent */

--lime-100:#EDF7E4;

--gold-600:#B78A16;

--gold-100:#FBF2DA;

--neutral-050:#F5F6F7;
--neutral-100:#EDEFF1;
--neutral-200:#E7E9EC;
--neutral-400:#9AA0A8;
--neutral-600:#42464E;
--neutral-900:#111111;

/* --- Semantic status --- */
--status-success:#14804A;
--status-warning:#FFB547;
--status-error:#E84C4C;
--status-info:#106040;

--brand-primary:var(--green-700);
--brand-primary-strong:var(--green-900);
--brand-primary-soft:var(--green-100);
--brand-accent:var(--lime-500);
--brand-accent-soft:var(--lime-100);
--brand-gold:var(--gold-500);

--surface-page:var(--neutral-000);

--surface-inverse:var(--green-900);

--fw-light:300; /* @kind other */

--text-body-lg-size:20px;--text-body-lg-lh:30px;--text-body-lg-weight:var(--fw-regular);
--text-body-md-size:16px;--text-body-md-lh:24px;--text-body-md-weight:var(--fw-regular);
--text-body-sm-size:14px;--text-body-sm-lh:20px;--text-body-sm-weight:var(--fw-regular);

--space-md:46px;
--space-lg:68px;
--space-xl:96px;

/* base */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);font-size:var(--text-body-md-size);line-height:var(--text-body-md-lh);color:var(--text-body);background:var(--surface-page);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,h5,h6{font-family:var(--font-display);color:var(--text-heading);margin:0;text-wrap:balance}

a{color:var(--text-link);text-decoration:none;transition:color var(--duration-base) var(--ease-standard)}

img{max-width:100%;display:block}

html,body{background:var(--surface-page)}
